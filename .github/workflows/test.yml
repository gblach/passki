name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: test (${{ matrix.toolchain }}, ${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta, nightly]
        backend: [rust-crypto, aws-lc-rs, graviola]
    env:
      FEATURES: --no-default-features --features ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.backend }}
      - run: cargo check $FEATURES
      - run: cargo test $FEATURES
      - run: cargo clippy $FEATURES -- -D warnings
